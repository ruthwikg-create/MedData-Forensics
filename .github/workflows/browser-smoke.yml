name: Browser interaction QA (synthetic)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "tests/browser-smoke.spec.cjs"
      - ".github/workflows/browser-smoke.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "tests/browser-smoke.spec.cjs"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project and browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium
      - name: Launch local research server
        run: |
          python -m uvicorn backend.api:app --host 127.0.0.1 --port 8765 > /tmp/meddata-uvicorn.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/api/health
      - name: Verify real browser interactions
        run: npx playwright test tests/browser-smoke.spec.cjs --reporter=line --workers=1
      - name: Upload synthetic-only browser screenshots and trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meddata-browser-qa
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Show server errors on failure
        if: failure()
        run: tail -n 120 /tmp/meddata-uvicorn.log
