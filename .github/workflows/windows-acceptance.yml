name: Windows software acceptance
on:
  push:
  pull_request:
jobs:
  windows-software-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install testing dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run backend and API tests
        run: python -m pytest -q
      - name: Test frontend routing
        run: node --test tests/test_frontend_routes.cjs tests/test_import_progress.cjs
      - name: Check Python syntax
        run: python -m compileall -q backend scripts
