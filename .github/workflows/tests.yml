name: Research workflow tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install project test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run research workflow tests
        run: python -m pytest -q
      - name: Run frontend routing regression tests
        run: node --test tests/test_frontend_routes.cjs tests/test_import_progress.cjs tests/test_notifications.cjs tests/test_motion_ui.cjs
